media:
  input: public/images
  output: /images

content: 
  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields: 
      - name: title
        label: Site title
        type: string
        required: true
      - name: tagline
        label: Tagline
        type: string
      - name: author
        label: Author
        type: string
      - name: footer
        label: Footer text
        type: text
      - name: posts
        label: Posts
        type: collection             
        path: src/content/posts
        format: yaml-frontmatter     
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: date
            label: Date
            type: date               
          - name: description
            label: Description
            type: text
          - name: cover
            label: Cover image
            type: image              
          - name: draft
            label: Draft
            type: boolean
            default: false
          - name: body
            label: Body
            type: rich-text          
            options:
              format: markdown       
